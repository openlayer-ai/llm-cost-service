services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/llm_costs
      ENABLE_SCHEDULER: "true"
      SCHEDULER_INTERVAL_HOURS: "24"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_costs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
